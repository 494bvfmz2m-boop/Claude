services:
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2
    restart: unless-stopped
    env_file: .env
    environment:
      _JAVA_OPTIONS: -Xmx1G
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
      - lavalink-plugins:/opt/Lavalink/plugins
    ports:
      - "127.0.0.1:2333:2333"

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      LAVALINK_URL: http://lavalink:2333
    depends_on:
      - lavalink

volumes:
  lavalink-plugins:
