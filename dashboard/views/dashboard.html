<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Bot Dashboard</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="app">
    <div class="sidebar">
      <h2>Servers</h2>
      <div class="guild-list" id="guild-list"><div class="loading">Loading...</div></div>
      <div class="nav-tabs" id="nav-tabs" style="display:none">
        <div class="nav-tab active" data-tab="settings">Settings</div>
        <div class="nav-tab" data-tab="tickets">Tickets</div>
        <div class="nav-tab" data-tab="giveaways">Giveaways</div>
        <div class="nav-tab" data-tab="orders">Orders</div>
        <div class="nav-tab" data-tab="warnings">Warnings</div>
      </div>
      <button class="secondary logout-btn" id="logout-btn">Log Out</button>
    </div>
    <div class="main" id="main">
      <div class="empty-state">Select a server from the sidebar to get started.</div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/js/dashboard.js"></script>
</body>
</html>
