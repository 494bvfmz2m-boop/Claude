<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knowledge Galaxy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --ink: #e8ecf8;
    --muted: #8a93ad;
    --glass: rgba(10, 14, 30, 0.72);
    --edge: rgba(140, 170, 255, 0.18);
    --accent: #7cc4ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font: 14px/1.55 Inter, system-ui, sans-serif; }
  #graph { position: fixed; inset: 0; }
  /* soft vignette for depth */
  #vignette { position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.75) 100%); }

  .hud { position: fixed; z-index: 5; pointer-events: none; }
  .hud > * { pointer-events: auto; }
  #title { top: 20px; left: 24px; }
  #title h1 { margin: 0; font: 700 22px/1.1 "Space Grotesk", sans-serif; letter-spacing: .14em;
    text-transform: uppercase; text-shadow: 0 0 18px rgba(124,196,255,.55); }
  #title p { margin: 6px 0 0; color: var(--muted); font-size: 12px; letter-spacing: .06em; }

  #search { margin-top: 14px; width: 260px; max-width: calc(100vw - 48px); padding: 9px 12px;
    background: var(--glass); border: 1px solid var(--edge); border-radius: 10px; color: var(--ink);
    font: inherit; outline: none; backdrop-filter: blur(10px); }
  #search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(124,196,255,.15); }
  #results { margin-top: 6px; width: 260px; max-width: calc(100vw - 48px); background: var(--glass);
    border: 1px solid var(--edge); border-radius: 10px; overflow: hidden; backdrop-filter: blur(10px); }
  #results:empty { display: none; }
  #results button { display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 12px; border: 0;
    background: none; color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
  #results button:hover, #results button.active { background: rgba(124,196,255,.12); }

  #legend { bottom: 20px; left: 24px; display: flex; flex-direction: column; gap: 4px;
    padding: 12px 14px; background: var(--glass); border: 1px solid var(--edge); border-radius: 12px;
    backdrop-filter: blur(10px); }
  #legend button { display: flex; align-items: center; gap: 9px; border: 0; background: none; color: var(--ink);
    font: inherit; font-size: 12.5px; cursor: pointer; padding: 2px 0; text-transform: capitalize; }
  #legend button.off { opacity: .35; }
  #legend .count { color: var(--muted); margin-left: auto; padding-left: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 10px currentColor;
    background: currentColor; }

  #hint { top: 22px; right: 24px; color: var(--muted); font-size: 12px; text-align: right; }
  #hint kbd { border: 1px solid var(--edge); border-radius: 4px; padding: 0 5px; font: inherit; }

  /* side panel */
  #panel { position: fixed; z-index: 10; top: 0; right: 0; height: 100%; width: 400px; max-width: 100vw;
    padding: 28px 26px; overflow-y: auto; background: linear-gradient(180deg, rgba(12,16,34,.88), rgba(6,8,18,.92));
    border-left: 1px solid var(--edge); backdrop-filter: blur(16px);
    transform: translateX(105%); transition: transform .6s cubic-bezier(.2,.8,.2,1);
    box-shadow: -30px 0 80px rgba(0,0,0,.6); }
  #panel.open { transform: none; }
  #panel .close { position: absolute; top: 18px; right: 18px; width: 32px; height: 32px; border-radius: 50%;
    border: 1px solid var(--edge); background: none; color: var(--ink); font-size: 18px; cursor: pointer; }
  #panel .close:hover { border-color: var(--accent); }
  #p-group { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--muted); }
  #p-title { margin: 10px 40px 4px 0; font: 700 26px/1.15 "Space Grotesk", sans-serif; }
  #p-meta { color: var(--muted); font-size: 12px; margin-bottom: 18px; }
  #p-excerpt { white-space: pre-line; color: #cfd6ea; font-weight: 300; font-size: 14.5px; line-height: 1.7;
    border-top: 1px solid var(--edge); padding-top: 18px; }
  #panel h3 { margin: 26px 0 10px; font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  #p-links { display: flex; flex-wrap: wrap; gap: 6px; }
  #p-links button { display: inline-flex; align-items: center; gap: 7px; padding: 5px 10px; border-radius: 999px;
    border: 1px solid var(--edge); background: rgba(255,255,255,.03); color: var(--ink); font: inherit; font-size: 12.5px; cursor: pointer; }
  #p-links button:hover { border-color: var(--accent); background: rgba(124,196,255,.1); }
  #p-links .dot { width: 7px; height: 7px; }
  #p-links button.shared { opacity: .6; }

  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted);
    letter-spacing: .3em; text-transform: uppercase; font-size: 12px; transition: opacity 1.2s; z-index: 20; background: #000; }
  #loading.gone { opacity: 0; pointer-events: none; }

  .scene-tooltip { font: 600 13px Inter, sans-serif !important; padding: 4px 10px !important;
    background: rgba(8,12,28,.8) !important; border: 1px solid var(--edge); border-radius: 8px !important; }

  /* ask bar */
  #chat { position: fixed; z-index: 8; left: 0; right: 0; bottom: 22px; margin: 0 auto;
    width: min(660px, calc(100vw - 400px)); transition: right .6s cubic-bezier(.2,.8,.2,1); }
  body.panel-open #chat { right: 400px; width: min(600px, calc(100vw - 840px)); min-width: 340px; }
  #ask { display: flex; align-items: center; gap: 6px; padding: 6px 6px 6px 18px; border-radius: 999px;
    background: rgba(10,14,30,.78); border: 1px solid var(--edge); backdrop-filter: blur(14px);
    box-shadow: 0 10px 40px rgba(0,0,0,.55), 0 0 0 1px rgba(124,196,255,.04) inset; transition: border-color .3s, box-shadow .3s; }
  #ask:focus-within { border-color: rgba(124,196,255,.55); box-shadow: 0 10px 40px rgba(0,0,0,.55), 0 0 28px rgba(124,196,255,.18); }
  #ask .spark { color: var(--accent); font-size: 15px; text-shadow: 0 0 10px var(--accent); }
  #q { flex: 1; min-width: 0; border: 0; outline: none; background: none; color: var(--ink); font: inherit; font-size: 15px; padding: 9px 4px; }
  #q::placeholder { color: #6f7896; }
  #ask button { flex: none; height: 38px; border-radius: 999px; border: 0; cursor: pointer; font: inherit; }
  #send { width: 38px; background: linear-gradient(135deg, #7cc4ff, #b388ff); color: #050815; font-size: 17px; font-weight: 700; }
  #send:disabled { opacity: .4; cursor: default; }
  #mic, #voice { width: 38px; background: none; color: var(--muted); font-size: 16px; border: 1px solid transparent !important; }
  #mic:hover, #voice:hover { color: var(--ink); border-color: var(--edge) !important; }
  #mic.on { color: #fff; background: rgba(255,70,90,.22); border-color: rgba(255,90,110,.7) !important;
    animation: micpulse 1.4s ease-out infinite; }
  #mic:disabled { opacity: .35; cursor: not-allowed; }
  #voice.muted { opacity: .5; }
  @keyframes micpulse { 0% { box-shadow: 0 0 0 0 rgba(255,80,100,.55); } 100% { box-shadow: 0 0 0 14px rgba(255,80,100,0); } }
  #status { display: flex; align-items: center; gap: 8px; margin: 0 0 8px 16px; font-size: 12.5px;
    letter-spacing: .04em; color: #c8d0e6; text-shadow: 0 1px 8px #000; }
  #status[hidden] { display: none; }
  #status .sdot { font-size: 11px; animation: sblink 1.1s ease-in-out infinite; }
  #status[data-state="listening"] .sdot { color: #ff5a6e; }
  #status[data-state="thinking"] .sdot { color: var(--accent); }
  #status[data-state="speaking"] .sdot { color: #b388ff; }
  #status[data-state="error"] .sdot { color: #ffb703; animation: none; }
  #status-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status-stop { border: 1px solid var(--edge); background: none; color: var(--muted); border-radius: 999px;
    font: inherit; font-size: 11px; padding: 1px 8px; cursor: pointer; }
  #status-stop:hover { color: var(--ink); }
  @keyframes sblink { 50% { opacity: .25; } }
  #newchat { padding: 0 12px; background: none; color: var(--muted); font-size: 12px; }
  #newchat:hover { color: var(--ink); }
  #answer { margin-bottom: 10px; padding: 16px 18px 14px;  border-radius: 16px; background: rgba(10,14,30,.82);
    border: 1px solid var(--edge); backdrop-filter: blur(14px); box-shadow: 0 10px 40px rgba(0,0,0,.5);
    max-height: 34vh; overflow-y: auto; opacity: 0; transform: translateY(10px); pointer-events: none;
    transition: opacity .45s, transform .45s; position: relative; }
  #answer.show { opacity: 1; transform: none; pointer-events: auto; }
  #a-q { color: var(--muted); font-size: 12px; margin: 0 26px 8px 0; }
  #a-text { font-size: 15px; line-height: 1.65; color: #e9eefc; }
  #a-text.error { color: #ff9b9b; }
  #a-text .ref { border: 0; padding: 0; background: none; font: inherit; color: inherit; cursor: pointer;
    border-bottom: 1px dashed currentColor; }
  #a-sources { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  #a-sources:empty { display: none; }
  #a-sources button { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--edge); background: rgba(255,255,255,.03); color: var(--ink); font: inherit; font-size: 12px; cursor: pointer; }
  #a-sources button:hover { border-color: var(--accent); }
  #a-sources .dot { width: 7px; height: 7px; }
  #a-undo { margin-top: 10px; padding: 4px 12px; border-radius: 999px; border: 1px solid rgba(255,183,3,.45);
    background: rgba(255,183,3,.08); color: #ffd27a; font: inherit; font-size: 12px; cursor: pointer; }
  #a-undo:hover { background: rgba(255,183,3,.16); }
  #a-undo[hidden] { display: none; }
  #a-close { position: absolute; top: 10px; right: 10px; width: 24px; height: 24px; border-radius: 50%; border: 0;
    background: none; color: var(--muted); cursor: pointer; font-size: 16px; }
  #a-close:hover { color: var(--ink); }
  .thinking { display: inline-flex; gap: 5px; align-items: center; color: var(--muted); }
  .thinking i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite both; }
  .thinking i:nth-child(2) { animation-delay: .2s; } .thinking i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; transform: scale(.8); } 40% { opacity: 1; transform: none; } }

  @media (max-width: 1100px) { #chat, body.panel-open #chat { right: 0; width: calc(100vw - 230px); min-width: 0; margin: 0 16px 0 auto; } }
  @media (max-width: 700px) {
    #chat, body.panel-open #chat { width: auto; left: 16px; right: 16px; bottom: 14px; margin: 0; }
    #legend { bottom: 80px !important; }
    #newchat { font-size: 0 !important; padding: 0 8px !important; } #newchat::after { content: '↺'; font-size: 17px; }
    #ask { padding-left: 12px; gap: 2px; } #ask .spark { display: none; }
    #title { left: 16px; top: 14px; } #title h1 { font-size: 17px; }
    #legend { left: 16px; bottom: 16px; } #hint { display: none; }
    #panel { top: auto; bottom: 0; height: 62vh; width: 100%; border-left: 0; border-top: 1px solid var(--edge);
      border-radius: 18px 18px 0 0; padding: 22px 16px; transform: translateY(105%); }
  }
</style>
</head>
<body>
<div id="graph"></div>
<div id="vignette"></div>
<div id="loading">Igniting stars…</div>

<div id="title" class="hud">
  <h1>Knowledge Galaxy</h1>
  <p id="stats"></p>
  <input id="search" type="search" placeholder="Search notes…" autocomplete="off" aria-label="Search notes">
  <div id="results"></div>
</div>
<div id="legend" class="hud" aria-label="Groups"></div>
<div id="hint" class="hud">Click a star to fly to it · drag to orbit · scroll to zoom · <kbd>Esc</kbd> to reset</div>

<div id="chat">
  <div id="answer" aria-live="polite">
    <button id="a-close" aria-label="Hide answer">×</button>
    <div id="a-q"></div>
    <div id="a-text"></div>
    <div id="a-sources"></div>
  </div>
  <div id="status" hidden aria-live="polite"><span class="sdot">●</span><span id="status-text"></span><button type="button" id="status-stop" hidden>stop</button></div>
  <form id="ask" autocomplete="off">
    <span class="spark">✦</span>
    <input id="q" type="text" maxlength="1000" placeholder="Ask Jarvis, or say “remember that…”  (press /)" aria-label="Ask Jarvis">
    <button type="button" id="newchat" title="Forget this conversation">New chat</button>
    <button type="button" id="voice" title="Read answers aloud" aria-label="Toggle spoken answers" aria-pressed="true">🔊</button>
    <button type="button" id="mic" title="Ask by voice" aria-label="Ask by voice">🎙</button>
    <button type="submit" id="send" aria-label="Ask">↑</button>
  </form>
</div>

<aside id="panel" aria-live="polite">
  <button class="close" aria-label="Close">×</button>
  <div id="p-group"><span class="dot"></span><span></span></div>
  <h2 id="p-title"></h2>
  <div id="p-meta"></div>
  <div id="p-excerpt"></div>
  <h3>Connected notes</h3>
  <div id="p-links"></div>
</aside>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/3d-force-graph@1.79.1/dist/3d-force-graph.min.js"></script>
<script src="graph-data.js"></script>
<script>
(() => {
  if (typeof ForceGraph3D === 'undefined' || typeof THREE === 'undefined') {
    document.getElementById('loading').textContent = 'Could not load 3d-force-graph from the CDN — check your connection.';
    return;
  }

  // ---------- data & lookups (node.id === index in GRAPH.nodes) ----------
  // These arrays are filled in place by loadData() so every closure keeps working
  // when Jarvis changes the notes and the graph is reloaded.
  const nodes = [];
  const byId = i => nodes[i];
  const neighbors = [];                               // id -> Map(neighborId -> link type)
  const PALETTE = ['#4cc9f0', '#f72585', '#ffb703', '#7bf1a8', '#b388ff', '#ff7b54', '#5eead4', '#f9a8d4', '#a3e635', '#fde047'];
  const groups = [];
  const groupColor = {};
  const hiddenGroups = new Set();

  function loadData(data) {
    nodes.length = 0; data.nodes.forEach(n => nodes.push(n));
    neighbors.length = 0; nodes.forEach(() => neighbors.push(new Map()));
    data.links.forEach(l => {
      const s = typeof l.source === 'object' ? l.source.id : l.source;
      const t = typeof l.target === 'object' ? l.target.id : l.target;
      neighbors[s].set(t, l.type); neighbors[t].set(s, l.type);
    });
    groups.length = 0; [...new Set(nodes.map(n => n.group))].sort().forEach(g => groups.push(g));
    groups.forEach(g => { if (!groupColor[g]) groupColor[g] = PALETTE[Object.keys(groupColor).length % PALETTE.length]; });
    document.getElementById('stats').textContent =
      `${nodes.length} note${nodes.length === 1 ? '' : 's'} · ${data.links.length} connections · ${groups.length} constellation${groups.length === 1 ? '' : 's'}`;
  }
  loadData(GRAPH);

  // ---------- glow texture ----------
  function glowTexture() {
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const g = c.getContext('2d');
    const grd = g.createRadialGradient(64, 64, 0, 64, 64, 64);
    grd.addColorStop(0, 'rgba(255,255,255,1)');
    grd.addColorStop(0.15, 'rgba(255,255,255,0.85)');
    grd.addColorStop(0.4, 'rgba(255,255,255,0.25)');
    grd.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
    const tex = new THREE.CanvasTexture(c);
    return tex;
  }
  const GLOW = glowTexture();
  const coreGeo = new THREE.SphereGeometry(1, 24, 24);

  const radius = n => 3 + Math.sqrt(n.degree || 1) * 1.1;

  function makeNodeObject(n) {
    const color = new THREE.Color(groupColor[n.group]);
    const r = radius(n);
    const group = new THREE.Group();
    const core = new THREE.Mesh(coreGeo, new THREE.MeshBasicMaterial({ color: color.clone().lerp(new THREE.Color('#fff'), .2), transparent: true }));
    core.scale.setScalar(r);
    core.renderOrder = 10;               // draw after all glows so cores keep their true color
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: .9 }));
    halo.scale.setScalar(r * 6);
    const corona = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: .3 }));
    corona.scale.setScalar(r * 15);
    group.add(corona, halo, core);
    n.__parts = { core, halo, corona, r, phase: Math.random() * Math.PI * 2 };
    return group;
  }

  // ---------- graph ----------
  const elem = document.getElementById('graph');
  const Graph = ForceGraph3D({ controlType: 'trackball' })(elem)
    .backgroundColor('#000000')
    .showNavInfo(false)
    .graphData(GRAPH)
    .nodeId('id')
    .nodeLabel(n => `<span style="color:${groupColor[n.group]}">●</span> ${escapeHtml(n.label)}`)
    .nodeThreeObject(makeNodeObject)
    .nodeVisibility(n => !hiddenGroups.has(n.group))
    .linkVisibility(l => !hiddenGroups.has(l.source.group ?? byId(l.source).group) && !hiddenGroups.has(l.target.group ?? byId(l.target).group))
    .linkColor(l => linkColor(l))
    .linkOpacity(0.35)
    .linkWidth(l => isHotLink(l) ? (l.type === 'mention' ? 1.4 : 0.5) : 0)
    .linkDirectionalParticles(l => isHotLink(l) && l.type === 'mention' ? 3 : 0)
    .linkDirectionalParticleWidth(1.6)
    .linkDirectionalParticleSpeed(0.006)
    .linkDirectionalParticleColor(l => groupColor[l.source.group])
    .onNodeClick(n => select(n))
    .onNodeHover(n => { elem.style.cursor = n ? 'pointer' : 'grab'; })
    .onBackgroundClick(() => deselect())
    .onEngineStop(() => releasePins())
    .onNodeDragEnd(() => releasePins());

  // Mention links shape the galaxy; shared-wikilink links pull only gently.
  Graph.d3Force('link').strength(l => l.type === 'mention' ? 0.35 : 0.02).distance(l => l.type === 'mention' ? 60 : 120);
  Graph.d3Force('charge').strength(-160);

  const scene = Graph.scene();
  const renderer = Graph.renderer();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

  // ---------- starfield ----------
  function starLayer(count, rMin, rMax, size, opacity) {
    const pos = new Float32Array(count * 3), col = new Float32Array(count * 3);
    const tints = [new THREE.Color('#ffffff'), new THREE.Color('#cfe0ff'), new THREE.Color('#ffe6c7'), new THREE.Color('#b9c8ff')];
    for (let i = 0; i < count; i++) {
      const u = Math.random() * 2 - 1, th = Math.random() * Math.PI * 2;
      const r = rMin + Math.random() * (rMax - rMin), s = Math.sqrt(1 - u * u);
      pos.set([r * s * Math.cos(th), r * u, r * s * Math.sin(th)], i * 3);
      const c = tints[(Math.random() * tints.length) | 0].clone().multiplyScalar(0.5 + Math.random() * 0.5);
      col.set([c.r, c.g, c.b], i * 3);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
    const mat = new THREE.PointsMaterial({ size, map: GLOW, vertexColors: true, transparent: true, opacity,
      depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true });
    return new THREE.Points(geo, mat);
  }
  const stars = new THREE.Group();
  stars.add(starLayer(6000, 1800, 4000, 9, 0.9), starLayer(1500, 1200, 3000, 18, 0.55), starLayer(120, 1500, 3500, 40, 0.8));
  // faint nebula clouds
  ['#3a1c71', '#0f4c75', '#5c2a6b', '#123a5a'].forEach((c, i) => {
    const neb = new THREE.Sprite(new THREE.SpriteMaterial({ map: GLOW, color: c, transparent: true, opacity: .35, depthWrite: false, blending: THREE.AdditiveBlending }));
    const a = i * Math.PI / 2 + .6;
    neb.position.set(Math.cos(a) * 2600, (i % 2 ? 1 : -1) * 700, Math.sin(a) * 2600);
    neb.scale.setScalar(2600 + i * 400);
    stars.add(neb);
  });
  scene.add(stars);
  Graph.camera().far = 20000; Graph.camera().updateProjectionMatrix();

  // ---------- selection & highlight ----------
  let selected = null;
  let answerSet = null;                       // ids of notes used for the current chat answer
  const hot = new Set();                      // ids of selected + neighbors

  function isHotLink(l) {
    const s = l.source.id ?? l.source, t = l.target.id ?? l.target;
    if (selected) return s === selected.id || t === selected.id;
    if (answerSet) return answerSet.has(s) && answerSet.has(t);
    return false;
  }
  function linkColor(l) {
    const focusMode = selected || answerSet;
    if (focusMode && !isHotLink(l)) return 'rgba(80,90,120,0.08)';
    if (l.type === 'shared') return focusMode ? 'rgba(170,190,255,0.35)' : 'rgba(120,140,200,0.10)';
    return focusMode ? groupColor[l.source.group] || '#9ab' : 'rgba(150,190,255,0.55)';
  }
  function refreshLinks() {
    Graph.linkColor(Graph.linkColor()).linkWidth(Graph.linkWidth()).linkDirectionalParticles(Graph.linkDirectionalParticles());
  }

  function select(n, { fly = true, extra = [] } = {}) {
    selected = n; answerSet = null;
    hot.clear(); hot.add(n.id); neighbors[n.id].forEach((_, id) => hot.add(id));
    extra.forEach(id => hot.add(id));
    refreshLinks();
    openPanel(n);
    if (fly) flyTo(n);
    pauseDrift(4000);
  }
  function deselect() {
    if (!selected && !answerSet) return;
    selected = null; answerSet = null; hot.clear(); refreshLinks(); closePanel();
  }

  function flyTo(n) {
    const dist = 130 + radius(n) * 10;
    const len = Math.hypot(n.x, n.y, n.z) || 1;
    const cam = Graph.camera().position;
    // approach from the side the camera is already on, offset slightly for a cinematic angle
    const dir = new THREE.Vector3(cam.x - n.x, cam.y - n.y, cam.z - n.z).normalize()
      .add(new THREE.Vector3(n.x / len, n.y / len, n.z / len).multiplyScalar(.4)).normalize();
    Graph.cameraPosition({ x: n.x + dir.x * dist, y: n.y + dir.y * dist + 12, z: n.z + dir.z * dist }, n, 2200);
  }

  function resetView() {
    deselect();
    Graph.cameraPosition({ x: 0, y: 60, z: 520 }, { x: 0, y: 0, z: 0 }, 2200);
  }

  // ---------- keep the focus in the visible area (left of the panel, above the answer) ----------
  const viewOff = { x: 0, y: 0 };
  function targetOffset() {
    // looked up here because the tick loop starts before the panel/answer code below runs
    const panel = document.getElementById('panel'), answerBox = document.getElementById('answer');
    const W = innerWidth, panelOpen = panel.classList.contains('open');
    let x = 0, y = 0;
    if (panelOpen) { if (W > 700) x = panel.offsetWidth / 2; else y += panel.offsetHeight / 2; }
    if (answerBox.classList.contains('show') && !(panelOpen && W <= 700)) y += (answerBox.offsetHeight + 90) / 2;
    return { x, y };
  }
  function updateViewOffset() {
    const t = targetOffset(), cam = Graph.camera();
    if (Math.abs(t.x - viewOff.x) < 0.3 && Math.abs(t.y - viewOff.y) < 0.3) { if (viewOff.settled) return; viewOff.settled = true; }
    else viewOff.settled = false;
    viewOff.x += (t.x - viewOff.x) * 0.08; viewOff.y += (t.y - viewOff.y) * 0.08;
    const W = elem.clientWidth, H = elem.clientHeight;
    if (Math.abs(viewOff.x) < 0.5 && Math.abs(viewOff.y) < 0.5) cam.clearViewOffset();
    else cam.setViewOffset(W, H, viewOff.x, viewOff.y, W, H);
  }
  window.addEventListener('resize', () => { viewOff.settled = false; });

  // ---------- per-frame: twinkle, dimming, idle drift ----------
  const clock = new THREE.Clock();
  let driftPausedUntil = 0;
  function pauseDrift(ms = 6000) { driftPausedUntil = performance.now() + ms; }
  ['pointerdown', 'wheel', 'touchstart'].forEach(ev => elem.addEventListener(ev, () => pauseDrift(), { passive: true }));

  (function tick() {
    const dt = Math.min(clock.getDelta() || 0.016, 0.05), t = clock.elapsedTime;
    nodes.forEach(n => {
      const p = n.__parts; if (!p) return;
      const dim = hot.size > 0 && !hot.has(n.id);
      const focus = selected ? selected.id === n.id : !!answerSet && answerSet.has(n.id);
      const pulse = 1 + Math.sin(t * 1.6 + p.phase) * 0.08 + (focus ? Math.sin(t * 3) * 0.12 : 0);
      const targetOp = dim ? 0.06 : 1;
      p.halo.material.opacity += ((dim ? .05 : focus ? 1 : .9) - p.halo.material.opacity) * .1;
      p.corona.material.opacity += ((dim ? .02 : focus ? .45 : .3) - p.corona.material.opacity) * .1;
      p.core.material.opacity += (targetOp - p.core.material.opacity) * .1;
      // a newborn note grows in and flares a few times
      let born = 1, flare = 1;
      if (n.__bornAt) {
        const age = (performance.now() - n.__bornAt) / 1000;
        if (age < 4) {
          born = Math.min(1, age / 0.7);
          flare = 1 + 2.2 * Math.max(0, 1 - age / 4) * (0.55 + 0.45 * Math.sin(age * 9));
        } else n.__bornAt = 0;
      }
      p.core.scale.setScalar(p.r * born);
      p.halo.scale.setScalar(p.r * 6 * pulse * (focus ? 1.4 : 1) * flare);
      p.corona.scale.setScalar(p.r * 15 * pulse * (focus ? 1.5 : 1) * flare);
    });
    updateViewOffset();
    stars.rotation.y += 0.00004; stars.rotation.x += 0.00001;

    // slow orbit around whatever the camera is looking at
    if (performance.now() > driftPausedUntil) {
      const controls = Graph.controls();
      const target = controls.target, cam = Graph.camera();
      const off = cam.position.clone().sub(target);
      off.applyAxisAngle(new THREE.Vector3(0, 1, 0), (selected ? 0.05 : 0.035) * dt * 2.2);
      cam.position.copy(target).add(off);
      cam.lookAt(target);
    }
    requestAnimationFrame(tick);
  })();

  // ---------- panel ----------
  const panel = document.getElementById('panel');
  function openPanel(n) {
    const color = groupColor[n.group];
    panel.querySelector('#p-group .dot').style.color = color;
    panel.querySelector('#p-group span:last-child').textContent = n.group;
    panel.querySelector('#p-title').textContent = n.label;
    panel.querySelector('#p-title').style.textShadow = `0 0 24px ${color}88`;
    panel.querySelector('#p-meta').textContent = `${n.path} · ${n.words} words · ${neighbors[n.id].size} connections`;
    panel.querySelector('#p-excerpt').textContent = n.excerpt;
    const list = panel.querySelector('#p-links'); list.innerHTML = '';
    [...neighbors[n.id].entries()]
      .sort((a, b) => (a[1] === b[1] ? byId(a[0]).label.localeCompare(byId(b[0]).label) : a[1] === 'mention' ? -1 : 1))
      .forEach(([id, type]) => {
        const m = byId(id), b = document.createElement('button');
        b.className = type;
        b.title = type === 'mention' ? 'Mentions / mentioned by this note' : 'Shares [[wikilinks]] with this note';
        b.innerHTML = `<span class="dot" style="color:${groupColor[m.group]}"></span>${escapeHtml(m.label)}`;

  // ---------- legend ----------
  const legend = document.getElementById('legend');
  function buildLegend() {
  legend.innerHTML = '';

    const b = document.createElement('button');
    b.innerHTML = `<span class="dot" style="color:${groupColor[g]}"></span>${escapeHtml(g)}<span class="count">${nodes.filter(n => n.group === g).length}</span>`;
    b.title = 'Toggle this group';

    };
    b.classList.toggle('off', hiddenGroups.has(g));
    legend.appendChild(b);
  });
  }
  buildLegend();

  // Swap in a new graph (after Jarvis created/deleted/edited notes) without a page reload.
  function reloadGraph(data, { bornId = null, nearId = null } = {}) {
    // ids are array positions and shift when notes are added/removed, so carry the
    // current layout over by file path: existing stars stay exactly where they are.
    const prev = new Map(nodes.map(n => [n.path, n]));
    selected = null; answerSet = null; hot.clear(); closePanel();
    // New data restarts the physics, so pin existing stars for a few seconds (fx/fy/fz)
    // and let only the new arrivals move; by the time they're released the layout has cooled.
    data.nodes.forEach(n => {
      const old = prev.get(n.path);
      if (old && old.x !== undefined)
        Object.assign(n, { x: old.x, y: old.y, z: old.z, fx: old.x, fy: old.y, fz: old.z, vx: 0, vy: 0, vz: 0 });
    });
    const born = bornId !== null ? data.nodes[bornId] : null;
    if (born) {
      const near = nearId !== null ? data.nodes[nearId] : null;
      const at = near && near.x !== undefined ? near : { x: 0, y: 0, z: 0 };
      // born right beside its closest relative (a hair's breadth, or repulsion would fling it away)
      const d = new THREE.Vector3(Math.random() - .5, Math.random() - .5, Math.random() - .5).normalize().multiplyScalar(22);
      Object.assign(born, { x: at.x + d.x, y: at.y + d.y, z: at.z + d.z, vx: 0, vy: 0, vz: 0, __bornAt: performance.now() });
      Object.assign(born, { fx: born.x, fy: born.y, fz: born.z });

    buildLegend();
    Graph.graphData(data);

  }
  let pinsHeld = false;
  function releasePins() {
    if (!pinsHeld) return;
    pinsHeld = false;
    nodes.forEach(n => { delete n.fx; delete n.fy; delete n.fz; });
  }

  // ---------- search ----------
  const search = document.getElementById('search'), results = document.getElementById('results');
  let matches = [], active = 0;
  function renderResults() {
    results.innerHTML = '';
    matches.forEach((n, i) => {
      const b = document.createElement('button');
      b.className = i === active ? 'active' : '';
      b.innerHTML = `<span class="dot" style="color:${groupColor[n.group]}"></span>${escapeHtml(n.label)}`;
      b.onclick = () => pick(n);
      results.appendChild(b);
    });
  }
  function pick(n) { search.value = ''; matches = []; renderResults(); search.blur(); select(n); }
  search.addEventListener('input', () => {
    const q = search.value.trim().toLowerCase();
    matches = q ? nodes.filter(n => n.label.toLowerCase().includes(q) || n.excerpt.toLowerCase().includes(q))
      .sort((a, b) => b.label.toLowerCase().includes(q) - a.label.toLowerCase().includes(q)).slice(0, 7) : [];
    active = 0; renderResults();
  });

    if (e.key === 'ArrowDown') { active = Math.min(active + 1, matches.length - 1); renderResults(); e.preventDefault(); }

    if (e.key === 'Enter' && matches[active]) pick(matches[active]);

    if (e.key === 'Escape') { stopSpeaking(); stopListening(true); search.value = ''; matches = []; renderResults(); hideAnswer(); document.activeElement.blur(); resetView(); }
    if (e.key === '/' && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); qInput.focus(); }
  });

  // ---------- ask your notes ----------
  const askForm = document.getElementById('ask'), qInput = document.getElementById('q'), sendBtn = document.getElementById('send');
  const answerBox = document.getElementById('answer'), aQ = document.getElementById('a-q'),
        aText = document.getElementById('a-text'), aSources = document.getElementById('a-sources');
  queueMicrotask(() => answerBox.appendChild(undoBtn));
  let asking = false;

  function hideAnswer() { answerBox.classList.remove('show'); }
  document.getElementById('a-close').onclick = hideAnswer;

  // Show where the answer came from: 1-3 notes -> fly to the top one, light it and its
  // neighbours and open its panel; 4+ notes -> light the whole cluster.
  function proveAnswer(ids) {
    if (!ids.length) { deselect(); return; }
    if (ids.length >= 4) highlightNotes(ids);
    else select(byId(ids[0]), { extra: ids.slice(1) });
  }
  function firstSentence(text) {
    const m = String(text || '').match(/^.*?[.!?…](?=\s|$)/);
    return (m ? m[0] : String(text || '')).slice(0, 200);
  }

  // ---------- undo Jarvis's last change ----------
  const undoBtn = document.createElement('button');
  undoBtn.id = 'a-undo'; undoBtn.type = 'button'; undoBtn.textContent = '↶ Undo change'; undoBtn.hidden = true;
  function showUndo(on) { undoBtn.hidden = !on; }
  undoBtn.onclick = async () => {
    undoBtn.disabled = true;
    try {
      const res = await fetch('chat/undo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
      const data = await res.json();
      if (data.graph) reloadGraph(data.graph);
      aText.classList.remove('error');
      aText.textContent = data.message || 'Undone.';
      aSources.innerHTML = '';
      showUndo(!!data.can_undo);
      setTimeout(() => Graph.zoomToFit(1500, 80), 900);
    } catch (e) {
      aText.classList.add('error'); aText.textContent = 'Undo failed: ' + e.message;
    } finally { undoBtn.disabled = false; }
  };

  function highlightNotes(ids) {
    selected = null; closePanel();
    answerSet = new Set(ids);
    hot.clear(); ids.forEach(i => hot.add(i));
    refreshLinks();

    else if (ids.length) Graph.zoomToFit(2000, 120 + targetOffset().y, n => answerSet.has(n.id));
    pauseDrift(6000);
  }

  function chip(n) {
    const b = document.createElement('button');
    b.innerHTML = `<span class="dot" style="color:${groupColor[n.group]}"></span>${escapeHtml(n.label)}`;
    b.onclick = () => select(n);
    return b;
  }

  function renderAnswer(question, text, ids) {
    aQ.textContent = question;
    aText.classList.remove('error');
    // turn note titles mentioned in the answer into clickable references
    let html = escapeHtml(text);
    ids.map(byId).sort((a, b) => b.label.length - a.label.length).forEach(n => {
      const re = new RegExp(escapeHtml(n.label).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
      html = html.replace(re, m => `<button class="ref" data-id="${n.id}" style="color:${groupColor[n.group]}">${m}</button>`);
    });

    aText.querySelectorAll('.ref').forEach(b => b.onclick = () => select(byId(+b.dataset.id)));

    ids.forEach(i => aSources.appendChild(chip(byId(i))));
  }

  async function ask(question) {
    if (asking) return;
    asking = true; sendBtn.disabled = true;
    stopSpeaking(); setStatus('thinking');
    aQ.textContent = question; aSources.innerHTML = ''; aText.classList.remove('error');
    aText.innerHTML = '<span class="thinking"><i></i><i></i><i></i>&nbsp; Consulting your notes…</span>';
    answerBox.classList.add('show');
    try {
      const res = await fetch('chat', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question }) });
      const data = await res.json().catch(() => ({ error: `Server returned ${res.status}` }));
      if (!res.ok || data.error) throw new Error(data.error || `Server returned ${res.status}`);
      if (data.graph) reloadGraph(data.graph);            // Jarvis changed the notes
      const ids = (data.nodes || []).filter(i => byId(i));
      const changed = (data.changed || []).filter(i => byId(i));
      renderAnswer(question, data.answer, changed.length ? [...new Set([...changed, ...ids])] : ids);
      const via = { gemini: 'Gemini', anthropic: 'Claude API', 'claude-cli': 'Claude' }[data.backend] || data.backend;
      aQ.textContent = `${question}  ·  answered by ${via}${data.fallback ? ' (backup)' : ''}`;
      showUndo(!!data.can_undo && !!data.changes);

      if (changed.length || data.intent !== 'chat')
        setTimeout(() => proveAnswer(changed.length ? changed : ids), data.graph ? 900 : 0);  // let a new graph settle
      setStatus(null);
      speak(data.speech || firstSentence(data.answer), data.lang);
    } catch (err) {
      aText.classList.add('error');
      aText.textContent = err.message === 'Failed to fetch' ? 'Could not reach the server. Is server.py running?' : err.message;
      setStatus(null);
    } finally {
      asking = false; sendBtn.disabled = false;
    }
  }

  askForm.addEventListener('submit', e => {
    e.preventDefault();
    const question = qInput.value.trim();
    if (!question) return;
    qInput.value = '';
    submitText(question, 'typed');
  });

  // "remember that …" (typed or spoken) files a note; anything else goes to Jarvis.
  const REMEMBER = /^\s*(?:(?:hey|ok|okay)\s+)?(?:jarvis[,!.\s]+)?(?:please\s+|alsjeblieft\s+)?(?:remember|onthoud)\b/i;
  function submitText(text, source) {
    return REMEMBER.test(text) ? rememberIt(text, source) : ask(text);
  }

  async function rememberIt(text, source) {
    if (asking) return;
    asking = true; sendBtn.disabled = true;
    stopSpeaking(); setStatus('thinking', '(filing it away)');
    aQ.textContent = text; aSources.innerHTML = ''; aText.classList.remove('error');
    aText.innerHTML = '<span class="thinking"><i></i><i></i><i></i>&nbsp; Filing it away…</span>';
    answerBox.classList.add('show'); showUndo(false);
    try {
      const res = await fetch('remember', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ text, source }) });
      const data = await res.json().catch(() => ({ error: `Server returned ${res.status}` }));
      if (!res.ok || data.error) throw new Error(data.error || `Server returned ${res.status}`);
      reloadGraph(data.graph, { bornId: data.id, nearId: data.near });
      const n = byId(data.id);
      aQ.textContent = `${text}  ·  remembered`;
      aText.textContent = data.quip + (data.warning ? ` (${data.warning})` : '');
      aSources.innerHTML = '';
      if (n) aSources.appendChild(chip(n));
      if (data.related && data.near !== null && byId(data.near)) aSources.appendChild(chip(byId(data.near)));
      showUndo(!!data.can_undo);
      setStatus(null);
      speak(data.quip, data.lang);
      // let it grow in for a moment, then fly over and open it
      if (n) setTimeout(() => select(n, { extra: data.near !== null ? [data.near] : [] }), 650);
    } catch (err) {
      aText.classList.add('error');
      aText.textContent = err.message === 'Failed to fetch' ? 'Could not reach the server. Is server.py running?' : err.message;
      setStatus(null);
    } finally {
      asking = false; sendBtn.disabled = false;
    }
  }
  document.getElementById('newchat').onclick = async () => {
    await fetch('chat/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' }).catch(() => {});
    stopSpeaking(); hideAnswer(); deselect(); qInput.focus();
  };

  // ---------- voice: status line ----------
  const statusEl = document.getElementById('status'), statusText = document.getElementById('status-text'),
        statusStop = document.getElementById('status-stop');
  const STATUS_TEXT = { listening: 'listening…', thinking: 'thinking…', speaking: 'speaking…' };
  let statusTimer = null;
  function setStatus(state, detail) {
    clearTimeout(statusTimer);
    if (!state) { statusEl.hidden = true; statusEl.dataset.state = ''; return; }
    statusEl.hidden = false; statusEl.dataset.state = state;
    statusText.textContent = detail ? `${STATUS_TEXT[state] || ''} ${detail}`.trim() : (STATUS_TEXT[state] || '');
    statusStop.hidden = !(state === 'speaking' || state === 'listening');
    if (state === 'error') statusTimer = setTimeout(() => setStatus(null), 6000);
  }
  statusStop.onclick = () => { stopSpeaking(); stopListening(true); };

  // ---------- voice out: speechSynthesis ----------
  const synth = window.speechSynthesis;
  const voiceBtn = document.getElementById('voice');

  try { muted = localStorage.getItem('galaxy-voice-muted') === '1'; } catch (e) {}

  function pickVoice(want = 'en') {
    if (!synth) return null;
    want = (want || 'en').toLowerCase().split('-')[0];
    const score = v => {
      const lang = (v.lang || '').toLowerCase().replace('_', '-');
      let s;
      if (want === 'en') s = lang === 'en-gb' ? 100 : lang.startsWith('en') ? 40 : 0;   // prefer British English
      else s = lang.startsWith(want) ? 100 : 0;                                         // e.g. a Dutch voice for Dutch answers
      if (/natural|neural|online/i.test(v.name)) s += 20;                     // Edge/Windows neural voices
      if (/google uk english/i.test(v.name)) s += 15;                         // Chrome's built-in UK voices
      if (lang === 'en-gb' && /sonia|libby|ryan|hazel|george|susan|daniel|serena|kate|arthur|martha|oliver/i.test(v.name)) s += 10;
      return s;
    };
    const best = synth.getVoices().slice().sort((a, b) => score(b) - score(a))[0] || null;
    return best && score(best) > 0 ? best : null;
  }
  function refreshVoice() {
    voice = pickVoice();
    voiceBtn.title = muted ? 'Spoken answers are off: click to turn on'
      : `Reading answers aloud${voice ? ' with ' + voice.name + ' (' + voice.lang + ')' : ''}: click to mute`;
  }
  function renderVoiceBtn() {
    voiceBtn.textContent = muted ? '🔇' : '🔊';

    if (muted) stopSpeaking();
    renderVoiceBtn();
  };

  // Browsers only allow speech after a user gesture. On the first click / key press we
  // speak a silent utterance inside that gesture, which unlocks speechSynthesis for the
  // rest of the session; anything that was blocked before is replayed then.
  function unlockAudio(e) {
    if (audioUnlocked || !synth) return;
    // If the first interaction is asking something, skip the queued greeting.
    if (pendingSpeech && pendingSpeech[2] === 'greeting' && e && e.target && e.target.closest && e.target.closest('#ask')) pendingSpeech = null;
    audioUnlocked = true;
    try {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;

    } catch (e) {}

  }
  ['pointerdown', 'keydown', 'touchend'].forEach(ev => window.addEventListener(ev, unlockAudio, { capture: true }));

  function chunksFor(text) {
    // Chrome cuts off long utterances (~15 s), so speak sentence by sentence.
    // Split only on punctuation followed by a space so "$5.50" stays intact.
    const out = [];
    text.replace(/\s+/g, ' ').trim().split(/(?<=[.!?…])\s+/).forEach(sentence => {
      while (sentence.length > 220) {
        let cut = sentence.lastIndexOf(', ', 220);
        if (cut < 80) cut = sentence.lastIndexOf(' ', 220);
        out.push(sentence.slice(0, cut + 1)); sentence = sentence.slice(cut + 1).trim();
      }
      if (sentence) out.push(sentence);
    });

  }

  function speak(text, lang, kind) {
    if (!synth || muted || !text) return;
    if (!audioUnlocked) {
      pendingSpeech = [text, lang, kind];
      setStatus('error', kind === 'greeting' ? 'Click anywhere and Jarvis will say hello.' : 'Click anywhere to hear the answer.');
      return;
    }
    const token = ++speakToken;
    synth.cancel();
    if (!voice) refreshVoice();
    const base = (lang || 'en').toLowerCase().split('-')[0];
    const v = base === 'en' ? voice : (pickVoice(base) || voice);
    const voiceFor = v;
    const parts = chunksFor(text);
    // a short delay after cancel() avoids Chrome dropping the first utterance
    setTimeout(() => {
      if (token !== speakToken) return;
      setStatus('speaking');
      synth.resume();                        // Chrome can get stuck in a paused state
      parts.forEach((part, i) => {
        const u = new SpeechSynthesisUtterance(part);
        if (voiceFor) { u.voice = voiceFor; u.lang = voiceFor.lang; } else u.lang = base === 'en' ? 'en-GB' : base;
        u.rate = 1.0; u.pitch = 1.0;

        u.onerror = e => {

          if (e.error === 'not-allowed') { audioUnlocked = false; pendingSpeech = [text, lang]; setStatus('error', 'Click anywhere to hear the answer.'); }
          else setStatus('error', `Speech failed (${e.error}).`);

  }
  function stopSpeaking() {
    speakToken++; pendingSpeech = null;
    if (synth && (synth.speaking || synth.pending)) synth.cancel();
    if (statusEl.dataset.state === 'speaking') setStatus(null);
  }

  // ---------- voice in: webkitSpeechRecognition ----------
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const micBtn = document.getElementById('mic');
  let rec = null, listening = false, heard = '', recError = null, discard = false;
  const MIC_ERRORS = {
    'not-allowed': 'Microphone blocked. Click the mic icon in the address bar and choose Allow.',
    'service-not-allowed': 'Microphone blocked. Click the mic icon in the address bar and choose Allow.',
    'audio-capture': 'No microphone found. Plug one in or check Windows sound settings.',
    'no-speech': "Didn't hear anything. Click 🎙 and try again.",
    'network': "Chrome's speech service is unreachable. Voice input needs an internet connection.",
    'language-not-supported': 'This language is not supported for voice input.',
  };
  if (!SR) { micBtn.disabled = true; micBtn.title = 'Voice input needs Google Chrome (or Edge)'; }

  function startListening() {
    if (!SR || listening || asking) return;
    stopSpeaking();                              // don't let the mic hear our own voice
    rec = new SR();
    rec.lang = 'en-GB'; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
    heard = ''; recError = null; discard = false;
    rec.onstart = () => { listening = true; micBtn.classList.add('on'); micBtn.title = 'Stop listening'; setStatus('listening'); };
    rec.onresult = e => {
      let final = '', interim = '';
      for (let i = 0; i < e.results.length; i++) {
        const t = e.results[i][0].transcript;
        e.results[i].isFinal ? final += t : interim += t;
      }
      heard = (final + interim).trim();
      qInput.value = heard;
      setStatus('listening', heard ? `“${heard}”` : '');
    };
    rec.onerror = e => { recError = e.error; };
    rec.onend = () => {
      listening = false; micBtn.classList.remove('on'); micBtn.title = 'Ask by voice';
      const text = heard.trim();
      if (discard) { setStatus(null); return; }
      if (recError && recError !== 'aborted' && !(recError === 'no-speech' && text)) {
        setStatus('error', MIC_ERRORS[recError] || `Voice input error (${recError}).`);
        return;
      }
      if (text) { qInput.value = ''; submitText(text, 'voice'); }      // same flow as typing + Enter
      else setStatus('error', MIC_ERRORS['no-speech']);
    };
    try { rec.start(); }
    catch (e) { setStatus('error', 'Could not start the microphone.'); }
  }
  function stopListening(cancel = false) {
    if (!rec || !listening) return;
    discard = cancel;
    cancel ? rec.abort() : rec.stop();           // stop() still delivers what was heard
  }
  micBtn.onclick = () => (listening ? stopListening() : startListening());

  // ---------- boot greeting ----------
  function greet() {
    const h = new Date().getHours();
    const part = h < 5 ? 'evening' : h < 12 ? 'morning' : h < 18 ? 'afternoon' : 'evening';
    const n = nodes.length;
    const line = n
      ? `Good ${part}, sir. ${n} note${n === 1 ? '' : 's'} indexed, all present and accounted for.`
      : `Good ${part}, sir. The archive is empty, which does make it rather easy to keep tidy.`;
    aQ.textContent = 'Jarvis';
    aText.classList.remove('error'); aText.textContent = line; aSources.innerHTML = '';
    answerBox.classList.add('show');
    speak(line, 'en', 'greeting');   // browsers hold this until the first click, then it plays
  }
  setTimeout(greet, 2600);   // after the opening camera glide

  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  // ---------- opening shot: start far out, glide in ----------
  Graph.cameraPosition({ x: 0, y: 400, z: 1800 });
  setTimeout(() => {
    document.getElementById('loading').classList.add('gone');
    Graph.cameraPosition({ x: 0, y: 60, z: 520 }, { x: 0, y: 0, z: 0 }, 4000);
    pauseDrift(4200);
  }, 400);

  // Expose for later features: look nodes up by index.
  window.Galaxy = { Graph, nodes, byId, neighbors, select, deselect, flyTo, ask, highlightNotes, proveAnswer, reloadGraph, rememberIt, speak, startListening };
})();
</script>
