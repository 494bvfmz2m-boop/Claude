[package]
name = "vault-crypto"
edition.workspace = true
version.workspace = true

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
thiserror = "1"
