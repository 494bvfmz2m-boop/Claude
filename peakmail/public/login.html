<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sign in · PeakMail</title>
    <meta name="theme-color" content="#0a0a12">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <script src="/js/boot.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/login.js" defer></script>
</head>
<body>
    <div class="aurora"><span></span><span></span><span></span></div>
    <main class="login-wrap">
        <form class="login-card" id="login" novalidate>
            <div class="brand"><div class="brand-mark" data-icon="mail"></div><span>PeakMail</span></div>
            <h1>Your inbox,<br><span class="grad-text">but make it peak.</span></h1>
            <p class="sub">Sign in with your Purelymail account.</p>
            <div class="form-error hidden" id="err" role="alert"></div>
            <label class="field">
                <span>Email</span>
                <input class="input" id="email" type="email" autocomplete="username" placeholder="you@yourdomain.com" required autofocus>
            </label>
            <label class="field">
                <span>Password</span>
                <div class="pw-wrap">
                    <input class="input" id="password" type="password" autocomplete="current-password" placeholder="Password or app password" required>
                    <button type="button" class="icon-btn" id="peek" data-icon="eye" aria-label="Show password"></button>
                </div>
            </label>
            <label class="check"><input type="checkbox" id="remember" checked> Keep me signed in for 30 days</label>
            <button class="btn btn-primary" id="submit" type="submit"><span>Sign in</span></button>
            <div class="login-foot"><span data-icon="lock"></span>Connects straight to imap.purelymail.com over SSL/TLS. Your session is encrypted.</div>
        </form>
    </main>
</body>
</html>
