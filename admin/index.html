<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Beheer · teksten en tijden</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body class="gated">
  <div id="gate" class="gate" aria-live="polite">
    <div class="gate-card"><p class="lede">Laden…</p></div>
  </div>

  <div id="app" hidden>
  <header class="topbar">
    <div class="topbar-brand">
      <span class="mark" aria-hidden="true"></span>
      <div>
        <strong>Beheer</strong>
        <span id="source" class="muted">teksten en tijden</span>
      </div>
    </div>
    <div class="topbar-status" id="status" role="status" aria-live="polite"></div>
    <div class="topbar-actions">
      <div class="user-box" id="userBox" hidden></div>
      <a class="btn ghost" href="../index.html" target="_blank" rel="noopener">Bekijk site ↗</a>
      <button class="btn primary" id="saveBtn" type="button" title="Ctrl + S">Opslaan</button>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <nav id="sideNav" aria-label="Onderdelen"></nav>
      <div class="side-tools">
        <p class="side-title">Bestand</p>
        <button class="btn small" id="exportBtn" type="button">Opslaan als content.js</button>
        <label class="btn small file-btn">Bestand laden…<input type="file" id="importInput" accept=".js,.json,application/json,text/javascript"></label>
        <button class="btn small danger" id="resetBtn" type="button">Terugzetten naar content.js</button>
      </div>
    </aside>

    <main id="panel" class="panel" tabindex="-1"></main>
  </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script src="../js/content.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="firebase.js"></script>
  <script src="admin.js"></script>
</body>
</html>
