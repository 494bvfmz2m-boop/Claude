server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Canonicalize: a direct request for /page.html redirects to /page,
  # mirroring the .htaccess rule used on the real (Apache) host.
  location ~ ^/(.+)\.html$ {
    return 301 /$1;
  }

  # Serve page.html for a request to /page without changing the visible URL.
  location / {
    try_files $uri $uri.html $uri/ =404;
  }
}
