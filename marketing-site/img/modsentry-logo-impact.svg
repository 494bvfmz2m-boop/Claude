<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="ModSentry">
  <style>
    .shield { transform-origin: 100px 100px; animation: q-pop .5s cubic-bezier(.2,1.4,.4,1) both; }
    .b0, .b1, .b2 { transform-origin: 100px 100px; opacity: 0; animation: q-impact .45s cubic-bezier(.16,1,.3,1) both; }
    .b0 { animation-delay: .12s; }
    .b1 { animation-delay: .22s; }
    .b2 { animation-delay: .32s; }
    @keyframes q-pop {
      0% { transform: scale(.6); opacity: 0; }
      60% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes q-impact {
      0% { transform: scale(.4) translateY(14px); opacity: 0; }
      70% { transform: scale(1.15) translateY(-3px); opacity: 1; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .shield, .b0, .b1, .b2 { animation: none; opacity: 1; }
    }
  </style>
  <g class="shield" fill="none">
    <path d="M100 12 L172 40 V104 C172 148 138 174 100 190 C62 174 28 148 28 104 V40 Z" fill="#eef6ff" stroke="#1d1f20" stroke-width="9"/>
    <path class="b0" d="M64 134 L100 108 L136 134" stroke="#7d0a1d" stroke-width="14" stroke-linecap="square"/>
    <path class="b1" d="M64 100 L100 74 L136 100" stroke="#c8102e" stroke-width="14" stroke-linecap="square"/>
    <path class="b2" d="M64 66 L100 40 L136 66" stroke="#f0455f" stroke-width="14" stroke-linecap="square"/>
  </g>
</svg>
