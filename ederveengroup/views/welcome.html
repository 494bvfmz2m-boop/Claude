<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <base href="%BASE%">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Choose a username · EderveenGroup</title>
    <meta name="theme-color" content="#0b0d12">
    <link rel="icon" href="favicon.svg?v=%V%" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=%V%">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css?v=%V%">
    <link rel="stylesheet" href="css/desk.css?v=%V%" media="(min-width: 761px)">
    <link rel="stylesheet" href="css/phone.css?v=%V%" media="(max-width: 760px)">
    <script src="js/boot.js?v=%V%"></script>
    <script src="js/icons.js?v=%V%"></script>
        <script src="js/welcome.js?v=%V%" defer></script>
</head>
<body>
    <div class="ambient" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <main class="login-main welcome-main">
        <form class="login-form welcome-form" id="welcome" novalidate autocomplete="off">
            <div class="brand"><span class="brand-mark"></span><span class="wordmark">Ederveen<em>Group</em></span></div>
            <p class="step">Welcome to EderveenGroup</p>
            <h2>Choose your username</h2>
            <p class="sub">It’s how people find your profile. You can change it later in Profile.</p>
            <div class="form-error hidden" id="err" role="alert"></div>
            <label class="field uname-field">
                <span>Username</span>
                <div class="uname"><i>@</i><input class="input" id="username" maxlength="30" spellcheck="false" autocapitalize="none" autocorrect="off" aria-describedby="uname-state" required><b class="uname-state" id="uname-mark" aria-hidden="true"></b></div>
                <span class="uname-hint" id="uname-state" aria-live="polite"></span>
            </label>
            <div class="uname-suggest hidden" id="suggest"></div>
            <p class="uname-url">Your profile: <b><span id="url-host"></span>/profile/#/<span id="url-name">…</span></b></p>
            <div class="submit-wrap"><button class="btn btn-primary" id="submit" type="submit" disabled><span>Continue</span></button></div>
        </form>
    </main>
</body>
</html>
