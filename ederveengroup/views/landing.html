<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>EderveenGroup · Work in progress</title>
    <meta name="description" content="EderveenGroup. Our new website is a work in progress.">
    <meta name="theme-color" content="#0b0d12">
    <link rel="icon" href="%BASE%favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="%BASE%css/app.css">
    <script src="%BASE%js/boot.js"></script>
    <script src="%BASE%js/icons.js"></script>
    <script src="%BASE%js/fx.js" defer></script>
    <script src="%BASE%js/landing.js" defer></script>
</head>
<body class="landing">
    <canvas class="stars" id="stars" aria-hidden="true"></canvas>
    <svg class="rings" id="rings" viewBox="0 0 400 400" fill="none" stroke="currentColor" aria-hidden="true">
        <g class="r-dotted" stroke-width=".6" stroke-dasharray="1 5"><circle cx="200" cy="200" r="190"/><circle cx="200" cy="200" r="150"/><circle cx="200" cy="200" r="70"/></g>
        <g class="r-solid" stroke-width=".5"><circle class="draw" pathLength="1" cx="200" cy="200" r="170"/><circle class="draw d2" pathLength="1" cx="200" cy="200" r="110"/></g>
        <g class="r-lines" stroke-width=".5"><path class="draw d3" pathLength="1" d="M200 10v380"/><path class="draw d4" pathLength="1" d="M10 200h380"/></g>
        <g class="r-pulses" stroke-width="1.4" stroke-linecap="round"><path class="pulse" pathLength="1" d="M200 10v380"/><path class="pulse p2" pathLength="1" d="M10 200h380"/><circle class="pulse p3" pathLength="1" cx="200" cy="200" r="170"/></g>
        <g class="orbit o1"><circle class="planet" cx="200" cy="30" r="3.2" fill="currentColor"/></g>
        <g class="orbit o2"><circle class="planet" cx="310" cy="200" r="2.6" fill="currentColor"/></g>
        <g class="orbit o3"><circle class="planet small" cx="200" cy="130" r="1.8" fill="currentColor"/></g>
    </svg>

    <header class="l-top">
        <div class="brand"><span class="brand-mark"></span><span class="wordmark">Ederveen<em>Group</em></span></div>
        <a class="btn l-mail" href="%BASE%" data-icon="mail">Mail</a>
    </header>

    <main class="l-hero">
        <div class="l-pill"><i></i>Work in progress</div>
        <h1 class="stagger"><span>Work in</span> <em><span class="sheen">progress.</span></em></h1>
        <p>We’re building something new for EderveenGroup.<br>Check back soon.</p>
        <div class="l-progress" role="presentation"><span></span></div>
    </main>

    <footer class="l-foot">
        <span>© <span id="year"></span> EderveenGroup</span>
        <a href="%BASE%">Staff mail →</a>
    </footer>
</body>
</html>
