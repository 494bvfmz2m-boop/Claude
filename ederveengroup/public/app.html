<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>EderveenGroup</title>
    <meta name="theme-color" content="#09090b">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/app.css">
    <script src="/js/boot.js"></script>
    <script src="/js/icons.js"></script>
    <script src="/js/app.js" defer></script>
</head>
<body>
    <div class="splash" id="splash"><span class="brand-mark"></span><span class="wordmark">Ederveen<em>Group</em></span></div>
    <div class="ambient" aria-hidden="true"><span></span><span></span></div>
    <div class="app" id="app">
        <aside class="sidebar">
            <div class="brand"><span class="brand-mark"></span><span class="wordmark">Ederveen<em>Group</em></span></div>
            <button class="btn btn-primary compose-btn" id="compose-btn" data-icon="pen"><span>New message</span><kbd>C</kbd></button>
            <nav class="folders" id="folders"></nav>
            <div class="side-foot">
                <div class="me">
                    <div class="avatar sm" id="me-avatar"></div>
                    <div class="who"><b id="me-email"></b><small><i class="live-dot" id="live-dot"></i><span id="live-text">Connecting…</span></small></div>
                </div>
                <div class="side-actions">
                    <button class="icon-btn" id="theme-btn" data-tip="Theme"></button>
                    <button class="icon-btn" id="palette-btn" data-icon="command" data-tip="Commands  Ctrl K"></button>
                    <button class="icon-btn" id="settings-btn" data-icon="settings" data-tip="Settings"></button>
                    <button class="icon-btn" id="logout-btn" data-icon="logout" data-tip="Sign out"></button>
                </div>
            </div>
        </aside>

        <div class="sheet">
            <section class="list-pane">
                <div class="list-head">
                    <div class="list-title">
                        <button class="icon-btn menu-btn" id="menu-btn" data-icon="menu" aria-label="Folders"></button>
                        <h2 id="folder-title">Inbox</h2>
                        <button class="icon-btn" id="refresh-btn" data-icon="refresh" data-tip="Refresh"></button>
                    </div>
                    <div class="greet hidden" id="greet"></div>
                    <div class="search">
                        <span data-icon="search"></span>
                        <input class="input" id="search" type="search" placeholder="Search mail" autocomplete="off">
                        <kbd>/</kbd>
                    </div>
                    <div class="chips" id="chips">
                        <button class="chip active" data-filter="">All</button>
                        <button class="chip" data-filter="unread">Unread</button>
                        <button class="chip" data-filter="flagged">Starred</button>
                        <button class="chip" data-filter="attachments">Attachments</button>
                    </div>
                </div>
                <div class="bulk hidden" id="bulk">
                    <button class="icon-btn" id="bulk-clear" data-icon="x" data-tip="Clear"></button>
                    <span class="count" id="bulk-count"></span>
                    <button class="icon-btn" data-bulk="read" data-icon="mailOpen" data-tip="Mark read"></button>
                    <button class="icon-btn" data-bulk="unread" data-icon="mail" data-tip="Mark unread"></button>
                    <button class="icon-btn" data-bulk="star" data-icon="star" data-tip="Star"></button>
                    <button class="icon-btn" data-bulk="archive" data-icon="archive" data-tip="Archive"></button>
                    <button class="icon-btn" data-bulk="move" data-icon="folder" data-tip="Move to…"></button>
                    <button class="icon-btn" data-bulk="delete" data-icon="trash" data-tip="Delete"></button>
                </div>
                <div class="messages" id="messages"></div>
                <div class="list-foot">
                    <span id="range"></span>
                    <span>
                        <button class="icon-btn" id="prev-page" data-icon="left" aria-label="Newer"></button>
                        <button class="icon-btn" id="next-page" data-icon="right" aria-label="Older"></button>
                    </span>
                </div>
            </section>
            <main class="reader" id="reader"></main>
        </div>
    </div>

    <button class="fab" id="fab" data-icon="pen" aria-label="New message"></button>
    <div class="toasts" id="toasts"></div>
</body>
</html>
