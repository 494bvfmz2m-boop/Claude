# Deploy target: Coolify. Coolify scans this file for ${VARIABLE} placeholders
# and generates matching input fields in its UI, so set every value below
# there rather than committing a .env file to the repo.
#
# One service, one container: the image's default command (scripts/start.js)
# runs the bot and the dashboard together in the same process tree. This
# matches the Dockerfile directly too, so the app behaves the same whether a
# host builds this compose file or just builds the Dockerfile on its own
# (some PaaS "Application"/"Dockerfile" deploy types do the latter and ignore
# this file's service definitions entirely).
services:
  app:
    build: .
    image: discord-management-bot:latest
    restart: unless-stopped
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN}
      CLIENT_ID: ${CLIENT_ID}
      GUILD_ID: ${GUILD_ID:-}
      DATABASE_PATH: /app/data/bot.sqlite
      DASHBOARD_PORT: 3000
      DASHBOARD_URL: ${DASHBOARD_URL}
      DASHBOARD_ADMIN_USERNAME: ${DASHBOARD_ADMIN_USERNAME}
      DASHBOARD_ADMIN_PASSWORD_HASH: ${DASHBOARD_ADMIN_PASSWORD_HASH}
      SESSION_SECRET: ${SESSION_SECRET}
      NODE_ENV: production
      ORDER_WEBHOOK_SECRET: ${ORDER_WEBHOOK_SECRET:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
    ports:
      - "3000:3000"
    volumes:
      - bot-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  bot-data:
